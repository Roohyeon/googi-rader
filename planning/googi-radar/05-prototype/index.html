<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고기 레이더 시안</title>
<style>
  :root { --ink:#1f2328; --muted:#6b7280; --line:#e5e7eb; --bg:#f6f6f4; --accent:#c2410c; --accent-soft:#fff1e8; --ok:#15803d; --warn:#b45309; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:var(--ink); background:#e9e7e2; }
  .proto-band { background:#111; color:#fff; font-size:12px; padding:6px 12px; text-align:center; }
  .controls { max-width:900px; margin:10px auto; padding:0 12px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:13px; }
  .controls .lbl { color:var(--muted); margin-right:4px; }
  .controls button { border:1px solid #bbb; background:#fff; border-radius:6px; padding:5px 9px; cursor:pointer; font:inherit; }
  .controls button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .phone { width:390px; max-width:100%; margin:0 auto 12px; background:var(--bg); border:1px solid #ccc; border-radius:18px; overflow:hidden; min-height:720px; position:relative; }
  .appbar { background:#fff; padding:12px 14px; border-bottom:1px solid var(--line); font-weight:700; display:flex; justify-content:space-between; align-items:center; }
  .appbar small { font-weight:400; color:var(--muted); font-size:12px; }
  .section { padding:12px 14px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin:4px 0 8px; }
  .chips .t { font-size:12px; color:var(--muted); width:48px; padding-top:6px; }
  .chip { border:1px solid var(--line); background:#fff; border-radius:999px; padding:5px 10px; font-size:13px; cursor:pointer; }
  .chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .map { position:relative; height:250px; background:
      linear-gradient(90deg, rgba(0,0,0,.04) 1px, transparent 1px) 0 0/25px 25px,
      linear-gradient(rgba(0,0,0,.04) 1px, transparent 1px) 0 0/25px 25px, #eef1ea; border-bottom:1px solid var(--line); }
  .map .road { position:absolute; background:#fff; }
  .map .station { position:absolute; left:47%; top:47%; font-size:11px; background:#2563eb; color:#fff; padding:2px 5px; border-radius:4px; }
  .pin { position:absolute; transform:translate(-50%,-100%); font-size:11px; padding:3px 6px; border-radius:6px; background:var(--accent); color:#fff; white-space:nowrap; cursor:pointer; border:1px solid rgba(0,0,0,.15); }
  .pin.gray { background:#9ca3af; }
  .pin.dim { opacity:.35; }
  .pin.note { background:#78350f; }
  .pin.sel { outline:2px solid #111; }
  .bubble { position:absolute; left:8px; right:8px; bottom:8px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px; font-size:13px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px; font-size:14px; }
  .card .row { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .rank { color:var(--muted); font-size:12px; margin-right:4px; }
  .price { font-weight:700; color:var(--accent); }
  .sub { color:var(--muted); font-size:12px; }
  .tag { display:inline-block; font-size:11px; padding:1px 6px; border-radius:4px; background:#f3f4f6; color:#374151; margin-left:4px; }
  .tag.aged { background:#ede9fe; color:#5b21b6; }
  .warn { color:var(--warn); font-size:12px; }
  .btns { display:flex; gap:6px; margin-top:8px; }
  .btn { border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 10px; font-size:13px; cursor:pointer; font-family:inherit; }
  .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn.ghost { background:transparent; }
  .groupttl { font-size:13px; font-weight:700; margin:14px 0 6px; }
  .cmpbar { position:sticky; bottom:0; background:#fff; border-top:1px solid var(--line); padding:10px 14px; display:flex; justify-content:space-between; align-items:center; font-size:13px; }
  .toast { position:absolute; left:14px; right:14px; bottom:64px; background:#111; color:#fff; padding:10px; border-radius:8px; font-size:13px; }
  .banner { background:#fef2f2; color:#991b1b; border-bottom:1px solid #fecaca; padding:10px 14px; font-size:13px; }
  .empty { text-align:center; color:var(--muted); padding:40px 20px; font-size:14px; line-height:1.6; }
  table.cmp { width:100%; border-collapse:collapse; font-size:13px; background:#fff; }
  table.cmp th, table.cmp td { border-bottom:1px solid var(--line); padding:7px 5px; text-align:center; vertical-align:top; }
  table.cmp th:first-child, table.cmp td:first-child { text-align:left; color:var(--muted); font-weight:400; width:64px; }
  .badge { display:inline-block; font-size:11px; padding:2px 6px; border-radius:4px; background:var(--accent-soft); color:var(--accent); font-weight:700; }
  .badge.same { background:#f3f4f6; color:#374151; }
  .gain { background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px; font-size:14px; line-height:1.5; margin-top:8px; }
  .open-q { border:2px dashed #eab308; background:#fefce8; border-radius:8px; padding:6px 8px; font-size:12px; margin-top:8px; }
  .open-q b { color:#854d0e; }
  label.f { display:block; font-size:12px; color:var(--muted); margin:10px 0 3px; }
  input, select { width:100%; padding:8px; border:1px solid #d1d5db; border-radius:8px; font:inherit; font-size:14px; background:#fff; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .err { color:#b91c1c; font-size:13px; margin-top:8px; }
  .okmsg { color:var(--ok); font-size:13px; margin-top:8px; }
  .reqs { max-width:900px; margin:0 auto 24px; padding:0 12px; font-size:12px; color:var(--muted); }
  .stateinfo { max-width:900px; margin:0 auto; padding:0 12px 6px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<div class="proto-band">시안(PROTOTYPE) — 실제 동작하지 않음 · 가게 이름·가격·지도는 모두 가상 · 오늘 날짜는 2026-11-10로 고정</div>

<div class="controls" id="tabs"></div>
<div class="controls" id="states"></div>
<div class="stateinfo" id="stateinfo"></div>
<div class="phone" id="phone"></div>
<div class="reqs" id="reqs"></div>

<script>
// ===== 가짜 데이터 (모두 가상) =====
const TODAY = new Date('2026-11-10T00:00:00+09:00');
const STORES = [
  {id:'s1', name:'숯불연가', x:30, y:40, dist:180, checked:'2026-10-20', memo:'', menus:[
    {name:'생삼겹살', part:'삼겹살', type:'생고기', aged:false, origin:'국내산', p100:null, w:160, price:14000},
    {name:'목살', part:'목살', type:'생고기', aged:false, origin:'국내산', p100:null, w:160, price:15000}]},
  {id:'s2', name:'돼지명가', x:58, y:33, dist:320, checked:'2026-10-22', memo:'', menus:[
    {name:'생삼겹살', part:'삼겹살', type:'생고기', aged:false, origin:'국내산', p100:null, w:180, price:15000},
    {name:'냉동삼겹살', part:'삼겹살', type:'냉동', aged:false, origin:'국내산', p100:null, w:200, price:12000}]},
  {id:'s3', name:'고기한판', x:44, y:62, dist:260, checked:'2026-09-30', memo:'', menus:[
    {name:'냉동삼겹살', part:'삼겹살', type:'냉동', aged:false, origin:'국내산', p100:null, w:180, price:11000},
    {name:'대패삼겹살', part:'삼겹살', type:'대패', aged:false, origin:'국내산', p100:null, w:200, price:9000}]},
  {id:'s4', name:'삼겹공방', x:72, y:56, dist:450, checked:'2026-10-05', memo:'2인분 이상 주문', menus:[
    {name:'숙성 생삼겹살', part:'삼겹살', type:'생고기', aged:true, origin:'국내산', p100:null, w:150, price:16000},
    {name:'생삼겹살', part:'삼겹살', type:'생고기', aged:false, origin:'국내산', p100:9000, w:150, price:14500}]},
  {id:'s5', name:'목살정원', x:20, y:66, dist:500, checked:'2026-04-02', memo:'', menus:[
    {name:'생삼겹살', part:'삼겹살', type:'생고기', aged:false, origin:'국내산', p100:8800, w:null, price:null},
    {name:'목살', part:'목살', type:'생고기', aged:false, origin:'국내산', p100:9300, w:null, price:null}]},
  {id:'s6', name:'구이마당', x:64, y:18, dist:600, checked:'2026-10-28', memo:'', menus:[
    {name:'삼겹살', part:'삼겹살', type:'생고기', aged:false, origin:'국내산', p100:null, w:null, price:16000}]},
  {id:'s7', name:'연탄골목', x:34, y:20, dist:380, checked:'2026-11-01', memo:'', menus:[
    {name:'생삼겹살', part:'삼겹살', type:'생고기', aged:false, origin:'국내산', p100:null, w:170, price:15500},
    {name:'수입 생삼겹살', part:'삼겹살', type:'생고기', aged:false, origin:'수입', p100:null, w:200, price:13000}]},
  {id:'s8', name:'참숯쌈', x:82, y:76, dist:700, checked:'2026-10-15', memo:'', menus:[
    {name:'항정살', part:'항정살', type:'생고기', aged:false, origin:'국내산', p100:null, w:150, price:18000}]},
  {id:'s9', name:'대패천국', x:52, y:84, dist:550, checked:'2026-10-10', memo:'', menus:[
    {name:'대패삼겹살', part:'삼겹살', type:'대패', aged:false, origin:'국내산', p100:null, w:250, price:9900},
    {name:'생삼겹살', part:'삼겹살', type:'생고기', aged:false, origin:'국내산', p100:null, w:160, price:15200}]},
  {id:'g1', name:'○○갈비', x:14, y:30, dist:420, gray:true, menus:[]},
  {id:'g2', name:'△△고깃집', x:88, y:32, dist:650, gray:true, menus:[]},
  {id:'g3', name:'□□숯불', x:40, y:47, dist:120, gray:true, menus:[]},
];
const RANKED_PARTS = ['삼겹살','목살'];
const RANKED_TYPES = ['생고기','냉동','대패'];

// ===== 계산 규칙 (03-spec R3, R4, R7, D21, D24, D26, D28) =====
const won = n => Math.round(n).toLocaleString('ko-KR') + '원';
const won10 = n => (Math.round(n/10)*10).toLocaleString('ko-KR') + '원';
function unit(m){ // 100g당 가격(반올림 전) 또는 null(중량 미표기)
  if (m.w && m.price){
    const calc = m.price / m.w * 100;
    if (m.p100 != null){
      if (Math.abs(Math.round(calc) - m.p100) >= 10) return {v:calc, mismatch:true, label:m.p100};
      return {v:m.p100, mismatch:false};
    }
    return {v:calc, mismatch:false};
  }
  if (m.p100 != null) return {v:m.p100, mismatch:false};
  return null; // 1인분 가격만 = 중량 미표기
}
const match = (m,f) => m.part===f.part && m.type===f.type && m.origin===f.origin;
function bestMenu(s,f){ // 조건에 맞는 메뉴 중 100g당 최저가
  let best=null;
  s.menus.filter(m=>match(m,f)).forEach(m=>{ const u=unit(m); if(u && (!best || u.v<best.u.v)) best={m,u}; });
  return best;
}
const noWeightMenus = (s,f) => s.menus.filter(m=>match(m,f) && !unit(m));
function staleOf(s){ const d=new Date(s.checked+'T00:00:00+09:00'); const lim=new Date(d); lim.setMonth(lim.getMonth()+6); if(lim.getDate()!==d.getDate()) lim.setDate(0); return TODAY>lim; }
function pinState(s,f){
  if (s.gray) return {cls:'gray', text:'정보 없음'};
  const b = bestMenu(s,f);
  if (b) return {cls:'', text:Math.round(b.u.v).toLocaleString('ko-KR')};
  const anyRanked = s.menus.some(m=>RANKED_PARTS.includes(m.part) && RANKED_TYPES.includes(m.type) && unit(m));
  if (anyRanked) return {cls:'dim', text:'필터 밖'};
  const onlyNoWeight = s.menus.length && s.menus.every(m=>!unit(m));
  return {cls:'note', text: onlyNoWeight ? '중량 미표기' : '다른 메뉴만'};
}
const xyDist = (a,b) => Math.hypot((a.x-b.x)*20, (a.y-b.y)*20); // 가짜 지도: 1칸 = 20m
function dongSise(sel,f){ // 동네 시세 = 반경 1km 같은 조건 가게 최저가의 중간값 (5곳 이상)
  for (let i=0;i<sel.length;i++) for (let j=i+1;j<sel.length;j++) if (xyDist(sel[i],sel[j])>2000) return null;
  const c = {x: sel.reduce((a,s)=>a+s.x,0)/sel.length, y: sel.reduce((a,s)=>a+s.y,0)/sel.length};
  const vals = STORES.filter(s=>!s.gray && xyDist(s,c)<=1000).map(s=>bestMenu(s,f)).filter(Boolean).map(b=>b.u.v).sort((a,b)=>a-b);
  if (vals.length<5) return null;
  const n=vals.length; return n%2 ? vals[(n-1)/2] : (vals[n/2-1]+vals[n/2])/2;
}
function josa(word, pair){ // pair: '이가' 또는 '은는' — 받침 있으면 앞 글자
  const c = word.charCodeAt(word.length-1) - 0xAC00;
  const has = c>=0 && c<=11171 && c%28!==0;
  return word + (has ? pair[0] : pair[1]);
}
function gainText(a,b){ // a, b = {s, m, u}. 이득 문구 (D21, D26-12)
  if (!a.m.w || !b.m.w || !a.m.price || !b.m.price){
    const [c,d] = a.u.v<=b.u.v ? [a,b] : [b,a];
    return `같은 100g이면 <b>${josa(c.s.name,'이가')}</b> ${won10(d.u.v-c.u.v)} 싸요.`;
  }
  if (a.m.w===b.m.w){ const [c,d]=a.m.price<=b.m.price?[a,b]:[b,a]; return `같은 ${a.m.w}g인데 <b>${josa(c.s.name,'이가')}</b> ${won10(d.m.price-c.m.price)} 싸요.`; }
  const [more,less] = a.m.w>b.m.w ? [a,b] : [b,a];
  const g = more.m.w-less.m.w, pd = more.m.price-less.m.price;
  if (pd<=0) return `<b>${josa(more.s.name,'이가')}</b> ${g}g 더 많고 ${won10(-pd)} 더 싸요.`;
  const value = g*less.u.v/100, gain = value-pd;
  if (gain>=0) return `<b>${josa(more.s.name,'이가')}</b> ${g}g 더 많고 ${won10(pd)} 더 비싸요. ${g}g을 ${less.s.name}에서 사면 ${won10(value)}이라 <b>${josa(more.s.name,'이가')} ${won10(gain)} 이득</b>이에요.`;
  return `<b>${josa(more.s.name,'은는')}</b> ${g}g 더 주지만 ${won10(-gain)} 비싸게 받는 셈이에요.`;
}

// ===== 화면 상태 =====
const ST = { tab:'map', state:{map:'정상', cmp:'정상', detail:'정상', admin:'로그인 전'},
  filter:{part:'삼겹살', type:'생고기', origin:'국내산'}, cmpIds:['s1','s2','s3'], cmpMeat:null, basis:'가성비',
  pinSel:null, toast:'', detailId:'s4', favs:{}, adminMsg:'', adminErr:'', form:null, picker:false };
const TABS = [['map','① 지도·목록'],['cmp','② 비교'],['detail','③ 가게 상세'],['admin','④ 운영자 입력']];
const STATES = {
  map:['정상','로딩','빈 목록','위치 거부','지역 밖','카카오 오류'],
  cmp:['정상','1곳만','비어 있음'],
  detail:['정상','오래된 정보','표기 불일치','다른 메뉴만'],
  admin:['로그인 전','입력','저장 실패'],
};
const STATE_NOTE = {
  '정상':'', '로딩':'카카오 검색 응답을 기다리는 동안', '빈 목록':'필터에 맞는 메뉴를 확인한 가게가 없을 때 (예: 목살·대패·수입)',
  '위치 거부':'위치 권한을 거부했을 때 (R2)', '지역 밖':'위치가 미추홀구·남동구 밖일 때 (D26-16)', '카카오 오류':'카카오 검색 실패·쿼터 초과 (D28-11): 저장된 우리 가게만 표시',
  '1곳만':'비교에 한 곳만 넣었을 때', '비어 있음':'비교에 넣은 가게가 없을 때',
  '오래된 정보':'메뉴 확인일 + 6개월이 지난 가게 (R10)', '표기 불일치':'메뉴판 100g당 표기와 1인분 계산값이 다른 가게 (R3, Q2)', '다른 메뉴만':'순위 밖 부위만 있는 가게 (R13, D28-2)',
  '로그인 전':'운영자 로그인 전 (D26-4)', '입력':'로그인 후 메뉴 입력', '저장 실패':'네트워크 오류로 저장 실패',
};
const REQS = {
  map:'R1 지도·목록, R2 위치 시작점, R3 100g당 계산, R4 정렬·필터, R5 중량 미표기, R10 확인일, D22 회색 핀, D24 가게 단위 순위, D28-1·2·3·11',
  cmp:'R6 비교, R7 이득 문구·추천·동네 시세, R8 리뷰 링크, R12 참가격(Should), D20, D21, D25, D26-6·12, D28-4·5·6·7·8, D29 비교 탭에서 가게 넣기·빼기, D30 동네 시세 표시',
  detail:'R3 표기 불일치, R8 리뷰 링크, R10 확인일, R13 다른 메뉴, R15 2인분 메모, R17 즐겨찾기, D24 숙성',
  admin:'R9 운영자 입력, R14 표기 비율, D26-4·9·15, D28-12',
};

function setTab(t){ ST.tab=t; ST.toast=''; render(); }
function setState(s){ ST.state[ST.tab]=s;
  if (ST.tab==='detail'){ ST.detailId = {'정상':'s1','오래된 정보':'s5','표기 불일치':'s4','다른 메뉴만':'s8'}[s]; }
  if (ST.tab==='cmp'){ ST.cmpIds = {'정상':['s1','s2','s3'],'1곳만':['s1'],'비어 있음':[]}[s]; ST.cmpMeat=null; }
  if (ST.tab==='admin' && s==='입력' && !ST.form) newForm();
  ST.adminMsg=''; ST.adminErr=''; render(); }
function setFilter(k,v){ ST.filter[k]=v; ST.pinSel=null; render(); }
function toggleCmp(id){
  const i=ST.cmpIds.indexOf(id);
  if (i>=0) ST.cmpIds.splice(i,1);
  else if (ST.cmpIds.length>=3){ ST.toast='최대 3곳까지 비교할 수 있어요. 한 곳을 빼고 넣어 주세요.'; render(); setTimeout(()=>{ST.toast='';render();},2500); return; }
  else ST.cmpIds.push(id);
  ST.cmpMeat=null; render(); }
function openDetail(id){ ST.detailId=id; ST.tab='detail'; ST.state.detail='정상'; render(); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ===== ① 지도·목록 =====
function viewMap(){
  const st=ST.state.map, f=ST.filter;
  let h = `<div class="appbar">고기 레이더 <small>주안역 주변 · 가짜 지도</small></div>`;
  if (st==='위치 거부' || st==='지역 밖'){
    const msg = st==='위치 거부' ? '위치를 쓰지 않아도 괜찮아요. 어느 동네부터 볼까요?' : '아직 이 지역은 준비 중이에요. 지금은 인천 미추홀구·남동구만 볼 수 있어요.';
    return h + `<div class="empty">${msg}<div class="btns" style="justify-content:center;margin-top:16px">
      <button class="btn primary" onclick="setState('정상')">주안역 주변 보기</button><button class="btn" onclick="setState('정상')">구월동 보기</button></div></div>`;
  }
  if (st==='카카오 오류') h += `<div class="banner">지금은 가게 목록을 불러올 수 없어요. 확인해 둔 가게만 보여 드릴게요. <button class="btn" style="margin-left:6px" onclick="setState('정상')">다시 불러오기</button></div>`;
  const chip=(k,arr)=>arr.map(v=>`<span class="chip ${f[k]===v?'on':''}" onclick="setFilter('${k}','${v}')">${v}</span>`).join('');
  h += `<div class="section" style="padding-bottom:0">
    <div class="chips"><span class="t">부위</span>${chip('part',RANKED_PARTS)}</div>
    <div class="chips"><span class="t">종류</span>${chip('type',RANKED_TYPES)}</div>
    <div class="chips"><span class="t">원산지</span>${chip('origin',['국내산','수입'])}</div></div>`;
  // 지도
  const visible = st==='카카오 오류' ? STORES.filter(s=>!s.gray) : STORES;
  h += `<div class="map"><div class="road" style="left:0;right:0;top:48%;height:8px"></div><div class="road" style="top:0;bottom:0;left:48%;width:8px"></div><div class="station">주안역</div>`;
  if (st==='로딩') h += `<div class="bubble">주변 고기집을 찾고 있어요…</div>`;
  else {
    visible.forEach(s=>{ const p=pinState(s,f); h+=`<div class="pin ${p.cls} ${ST.pinSel===s.id?'sel':''}" style="left:${s.x}%;top:${s.y}%" onclick="ST.pinSel='${s.id}';render()">${p.text}</div>`; });
    if (ST.pinSel){ const s=STORES.find(x=>x.id===ST.pinSel), p=pinState(s,f);
      if (s.gray) h += `<div class="bubble"><b>${s.name}</b> · 정보 없음 · 아직 메뉴를 확인하지 않은 가게예요<div class="btns"><a class="btn" href="#" onclick="return false">카카오맵에서 보기</a></div></div>`;
      else h += `<div class="bubble"><b>${s.name}</b> ${p.cls==='dim'?'· 이 필터에 맞는 메뉴가 없어요':p.cls==='note'?'· '+p.text:'· 100g당 '+p.text+'원'}
        <div class="btns"><button class="btn" onclick="openDetail('${s.id}')">상세 보기</button>${p.cls===''?`<button class="btn" onclick="toggleCmp('${s.id}')">${ST.cmpIds.includes(s.id)?'비교에서 빼기':'비교에 넣기'}</button>`:''}</div></div>`;
    }
  }
  h += `</div>`;
  // 목록
  h += `<div class="section"><div class="groupttl" style="margin-top:0">100g당 싼 순</div>`;
  if (st==='로딩'){ h += `<div class="empty">주변 고기집을 찾고 있어요…</div>`; }
  else {
    const ranked = visible.filter(s=>!s.gray).map(s=>({s,b:bestMenu(s,f)})).filter(x=>x.b).sort((a,b)=>a.b.u.v-b.b.u.v);
    const nw = visible.filter(s=>!s.gray && !bestMenu(s,f)).map(s=>({s,ms:noWeightMenus(s,f)})).filter(x=>x.ms.length);
    if (st==='빈 목록' || (!ranked.length && !nw.length)){
      h += `<div class="empty">이 조건의 메뉴를 확인한 가게가 아직 없어요.<br>다른 부위나 종류를 골라 보세요.</div>`;
    } else {
      ranked.forEach((x,i)=>{ const m=x.b.m, s=x.s;
        h += `<div class="card"><div class="row"><div><span class="rank">${i+1}</span><b>${s.name}</b> <span class="sub">${s.dist}m</span></div>
          <span class="chip" style="padding:2px 8px" onclick="ST.favs['${s.id}']=!ST.favs['${s.id}'];render()">${ST.favs[s.id]?'★':'☆'}</span></div>
          <div class="row" style="margin-top:4px"><div>${esc(m.name)}${m.aged?'<span class="tag aged">숙성</span>':''}</div><div class="price">100g당 ${won(x.b.u.v)}</div></div>
          <div class="sub">${m.w&&m.price?`1인분 ${m.w}g · ${won(m.price)}`:'100g당 가격만 표기'} · 메뉴 확인일 ${s.checked} ${staleOf(s)?'<span class="warn">· 오래된 정보일 수 있어요</span>':''}</div>
          <div class="btns"><button class="btn ${ST.cmpIds.includes(s.id)?'':'primary'}" onclick="toggleCmp('${s.id}')">${ST.cmpIds.includes(s.id)?'비교에서 빼기':'비교에 넣기'}</button><button class="btn" onclick="openDetail('${s.id}')">상세 보기</button></div></div>`; });
      if (nw.length){
        h += `<div class="groupttl">중량 미표기 · 100g당 가격을 계산할 수 없어요</div>`;
        nw.forEach(x=>{ h += `<div class="card"><div class="row"><b>${x.s.name}</b><span class="sub">${x.s.dist}m</span></div>${x.ms.map(m=>`<div class="sub">${esc(m.name)} 1인분 ${won(m.price)}</div>`).join('')}<div class="btns"><button class="btn" onclick="openDetail('${x.s.id}')">상세 보기</button></div></div>`; });
      }
    }
  }
  h += `</div>`;
  if (ST.cmpIds.length) h += `<div class="cmpbar"><span>비교할 가게 ${ST.cmpIds.length}곳</span><button class="btn primary" onclick="setTab('cmp')">비교 보기 (${ST.cmpIds.length}곳)</button></div>`;
  if (ST.toast) h += `<div class="toast">${ST.toast}</div>`;
  return h;
}

// ===== ② 비교 =====
function meatKey(m){ return m.part+'·'+m.type+'·'+m.origin; }
function pickerHtml(f){ // 비교 탭 안에서 가게 넣기 (사용자 요청, 5단계)
  const full = ST.cmpIds.length>=3;
  const cands = STORES.filter(s=>!s.gray && !ST.cmpIds.includes(s.id)).map(s=>({s,b:bestMenu(s,f)}))
    .sort((a,b)=>(a.b?a.b.u.v:1e9)-(b.b?b.b.u.v:1e9));
  let h = `<div class="card" style="margin-top:8px"><div class="row"><b>비교에 넣을 가게</b><button class="btn ghost" onclick="ST.picker=false;render()">닫기</button></div>`;
  if (full) h += `<div class="warn" style="margin:6px 0">최대 3곳까지 비교할 수 있어요. 한 곳을 빼고 넣어 주세요.</div>`;
  h += `<div class="sub">${f.part}·${f.type}·${f.origin} 100g당 싼 순 · 정보 없음 가게는 넣을 수 없어요</div>`;
  if (!cands.length) h += `<div class="sub" style="padding:8px 0">더 넣을 수 있는 가게가 없어요.</div>`;
  cands.forEach(x=>{ h += `<div class="row" style="padding:6px 0;border-top:1px solid var(--line)"><div>${x.s.name} <span class="sub">${x.s.dist}m</span><br><span class="sub">${x.b?'100g당 '+won(x.b.u.v):'이 고기 없음'}</span></div>
    <button class="btn ${full?'':'primary'}" ${full?'disabled':''} onclick="toggleCmp('${x.s.id}')">넣기</button></div>`; });
  return h + `</div>`;
}
function viewCmp(){
  let h = `<div class="appbar">비교 <small>최대 3곳</small></div>`;
  const sel = ST.cmpIds.map(id=>STORES.find(s=>s.id===id));
  if (!sel.length) return h + `<div class="empty">아직 비교할 가게가 없어요.<br>"가게 추가"를 눌러 2~3곳을 골라 보세요.<div class="btns" style="justify-content:center;margin-top:16px"><button class="btn primary" onclick="ST.picker=true;render()">+ 가게 추가</button><button class="btn" onclick="setTab('map')">목록으로 가기</button></div></div>`
    + (ST.picker ? `<div class="section">${pickerHtml(ST.filter)}</div>` : '');
  // ① 어떤 고기: 고른 가게 중 한 곳이라도 있는 고기만
  const counts = {};
  sel.forEach(s=>{ const seen={}; s.menus.filter(m=>RANKED_PARTS.includes(m.part)&&RANKED_TYPES.includes(m.type)).forEach(m=>{ const k=meatKey(m); if(!seen[k]){seen[k]=1;counts[k]=(counts[k]||0)+1;} }); });
  const keys = Object.keys(counts);
  const fk = meatKey(ST.filter);
  if (!ST.cmpMeat || !keys.includes(ST.cmpMeat)) ST.cmpMeat = keys.includes(fk) ? fk : keys.sort((a,b)=>counts[b]-counts[a])[0];
  const [part,type,origin] = ST.cmpMeat.split('·'); const f={part,type,origin};
  h += `<div class="section"><label class="f">어떤 고기를 비교할까요?</label><select onchange="ST.cmpMeat=this.value;render()">${keys.map(k=>`<option ${k===ST.cmpMeat?'selected':''}>${k}</option>`).join('')}</select>
    <label class="f">무엇을 기준으로 볼까요?</label><div class="chips">${['가성비','양','가격'].map(b=>`<span class="chip ${ST.basis===b?'on':''}" onclick="ST.basis='${b}';render()">${b}(${b==='가성비'?'100g당':'1인분'})</span>`).join('')}</div></div>`;
  // 가게별 대표 메뉴
  const rows = sel.map(s=>{ const b=bestMenu(s,f); const nwm=noWeightMenus(s,f)[0];
    return {s, b, nw: !b && nwm ? nwm : null, none: !b && !nwm}; });
  const sise = dongSise(sel,f);
  // 정렬과 배지
  const val = r => ST.basis==='가성비' ? (r.b?r.b.u.v:null) : ST.basis==='양' ? (r.b&&r.b.m.w? -r.b.m.w : null) : (r.b&&r.b.m.price? r.b.m.price : r.nw? r.nw.price : null);
  rows.sort((a,b)=>{ const va=val(a), vb=val(b); if(va==null&&vb==null)return 0; if(va==null)return 1; if(vb==null)return -1; return va-vb; });
  const comp = rows.filter(r=>val(r)!=null); const badges={};
  if (comp.length>=2){
    if (ST.basis==='가성비'){ const d=(comp[1].b.u.v-comp[0].b.u.v)/comp[1].b.u.v;
      if (d>=0.03) badges[comp[0].s.id]=['가성비 추천','']; else { badges[comp[0].s.id]=['거의 같아요','same']; badges[comp[1].s.id]=['거의 같아요','same']; } }
    else { const top=val(comp[0]); comp.filter(r=>val(r)===top).forEach(r=>badges[r.s.id]=[ST.basis==='양'?'양 최고':'가장 저렴','']); }
  }
  const cell = (r,fn) => r.none ? '<span class="sub">이 고기 없음</span>' : fn(r);
  h += `<table class="cmp"><tr><th></th>${rows.map(r=>`<th>${r.s.name}${badges[r.s.id]?`<br><span class="badge ${badges[r.s.id][1]}">${badges[r.s.id][0]}</span>`:''}${ST.basis==='가격'&&badges[r.s.id]&&r.nw?'<br><span class="sub">중량 미표기</span>':''}<br><button class="btn ghost" style="padding:2px 6px;font-size:11px;margin-top:4px" onclick="toggleCmp('${r.s.id}')">빼기</button></th>`).join('')}</tr>
    <tr><td>메뉴</td>${rows.map(r=>`<td>${cell(r,r=>esc((r.b||{m:r.nw}).m.name)+((r.b||{m:r.nw}).m.aged?'<br><span class="tag aged">숙성</span>':''))}</td>`).join('')}</tr>
    <tr><td>100g당</td>${rows.map(r=>`<td>${cell(r,r=>r.b?`<b>${won(r.b.u.v)}</b>`:'알 수 없음<br><span class="sub">(중량 미표기)</span>')}</td>`).join('')}</tr>
    <tr><td>1인분</td>${rows.map(r=>`<td>${cell(r,r=>{const m=r.b?r.b.m:r.nw; return m.w&&m.price?`${m.w}g<br>${won(m.price)}`:m.price?`- · ${won(m.price)}`:'-';})}</td>`).join('')}</tr>
    <tr><td>동네 시세 대비</td>${rows.map(r=>`<td>${cell(r,r=>{ if(!r.b||sise==null) return '-'; const p=(r.b.u.v-sise)/sise*100; return `${Math.abs(p).toFixed(1)}% ${p<0?'저렴':'비쌈'}`; })}</td>`).join('')}</tr>
    <tr><td>거리</td>${rows.map(r=>`<td>${r.s.dist}m</td>`).join('')}</tr>
    <tr><td>메뉴 확인일</td>${rows.map(r=>`<td>${r.s.checked}${staleOf(r.s)?'<br><span class="warn">오래된 정보일 수 있어요</span>':''}</td>`).join('')}</tr>
    <tr><td>리뷰</td>${rows.map(r=>`<td><a href="#" onclick="return false">카카오맵에서 리뷰 보기</a></td>`).join('')}</tr></table>`;
  h += `<div class="section">`;
  if (sise==null) h += `<div class="sub">동네 시세: - (비교할 가게가 아직 적어요)</div>`;
  else h += `<div class="sub">동네 시세(반경 1km, ${f.part}·${f.type}·${f.origin}): 100g당 ${won(sise)}</div>`;
  // 이득 문구: 가성비 1등 기준 (D26-6)
  const withU = rows.filter(r=>r.b).sort((a,b)=>a.b.u.v-b.b.u.v);
  if (sel.length===1) h += `<div class="gain">한 곳만 골랐어요. 한 곳을 더 넣으면 차이를 계산해 드려요.</div>`;
  else if (withU.length>=2){ const base=withU[0];
    withU.slice(1).forEach(o=>{ h += `<div class="gain">${gainText({s:base.s,m:base.b.m,u:base.b.u},{s:o.s,m:o.b.m,u:o.b.u})}</div>`; }); }
  if (ST.cmpMeat==='삼겹살·생고기·국내산') h += `<div class="open-q"><b>[열린 질문 Q4]</b> 참고: 인천 평균 100g ○○원 (참가격, YYYY년 M월) — 참가격 삼겹살이 생/냉동을 구분하는지 확인 전이라 값을 비워 둠 (R12, Should)</div>`;
  h += `<div class="btns"><button class="btn primary" onclick="ST.picker=!ST.picker;render()">${ST.picker?'추가 목록 닫기':'+ 가게 추가'}</button><button class="btn" onclick="setTab('map')">목록으로 돌아가기</button></div>`;
  if (ST.picker) h += pickerHtml(f);
  h += `</div>`;
  if (ST.toast) h += `<div class="toast">${ST.toast}</div>`;
  return h;
}

// ===== ③ 가게 상세 =====
function viewDetail(){
  const s = STORES.find(x=>x.id===ST.detailId) || STORES[0];
  let h = `<div class="appbar">${s.name} <span class="chip" onclick="ST.favs['${s.id}']=!ST.favs['${s.id}'];render()">${ST.favs[s.id]?'★ 즐겨찾기 해제':'☆ 즐겨찾기'}</span></div><div class="section">`;
  h += `<div class="sub">즐겨찾기는 이 폰에만 저장돼요. (시안에서는 새로고침하면 사라져요)</div>`;
  h += `<div style="margin:8px 0">메뉴 확인일 ${s.checked} ${staleOf(s)?'<span class="warn">· 오래된 정보일 수 있어요</span>':''}</div>`;
  if (s.memo) h += `<div class="card" style="padding:8px">${esc(s.memo)}</div>`;
  const ranked = s.menus.filter(m=>RANKED_PARTS.includes(m.part)&&RANKED_TYPES.includes(m.type));
  const others = s.menus.filter(m=>!ranked.includes(m));
  const line = m => { const u=unit(m);
    return `<div class="card"><div class="row"><div>${esc(m.name)}${m.aged?'<span class="tag aged">숙성</span>':''} <span class="tag">${m.part}·${m.type}·${m.origin}</span></div>
      <div class="price">${u?'100g당 '+won(u.v):'<span class="sub">중량 미표기</span>'}</div></div>
      <div class="sub">메뉴판 표기: ${[m.p100!=null?`100g ${won(m.p100)}`:'', m.w?`1인분 ${m.w}g`:'', m.price?`${m.w?'':'1인분 '}${won(m.price)}`:''].filter(Boolean).join(' · ')}</div>
      ${u&&u.mismatch?`<div class="open-q"><b>[열린 질문 Q2]</b> 메뉴판 표기와 계산값이 달라요 (표기 100g당 ${won(u.label)} · 계산 ${won(u.v)}). 순위에는 계산값을 써요.</div>`:''}</div>`; };
  if (ranked.length){ h += `<div class="groupttl">삼겹살·목살</div>` + ranked.map(line).join(''); }
  if (others.length){ h += `<div class="groupttl">다른 메뉴 (순위에는 쓰지 않아요)</div>` + others.map(line).join(''); }
  h += `<div class="btns"><a class="btn" href="#" onclick="return false">카카오맵에서 리뷰 보기</a>${ranked.some(m=>unit(m))?`<button class="btn primary" onclick="toggleCmp('${s.id}')">${ST.cmpIds.includes(s.id)?'비교에서 빼기':'비교에 넣기'}</button>`:''}</div>`;
  h += `<div class="btns"><button class="btn ghost" onclick="setTab('map')">← 목록으로</button></div></div>`;
  if (ST.toast) h += `<div class="toast">${ST.toast}</div>`;
  return h;
}

// ===== ④ 운영자 입력 =====
function newForm(){ ST.form={store:'g3', name:'', part:'삼겹살', type:'생고기', aged:false, origin:'국내산', p100:'', w:'', price:'', memo:'', date:'2026-11-10'}; }
function fv(k,v){ ST.form[k]=v; ST.adminErr=''; ST.adminMsg=''; renderPreview(); }
function previewText(){
  const F=ST.form; const num=x=>x===''?null:Number(x);
  const p100=num(F.p100), w=num(F.w), price=num(F.price);
  if ([p100,w,price].some(x=>x!=null && !(Number.isInteger(x)&&x>0))) return {err:'숫자만 넣어 주세요. (예: 14000)'};
  if (p100==null && w==null && price==null) return {err:'100g당 가격이나 1인분 가격 중 하나는 넣어 주세요.'};
  if (p100==null && price==null && w!=null) return {err:'중량만으로는 비교할 수 없어요. 1인분 가격도 넣어 주세요.'};
  const u = unit({p100, w: (w&&price)?w:null, price: (w&&price)?price:(p100==null?price:null)});
  if (!u) return {ok:'중량이 없어 100g당 가격을 계산할 수 없어요. "중량 미표기"로 저장돼요.'};
  return {ok:`100g당 ${won(u.v)}으로 계산돼요${u.mismatch?' (메뉴판 표기와 달라요)':''}`};
}
function renderPreview(){ const el=document.getElementById('pv'); if(!el||!ST.form||ST.tab!=='admin')return; const p=previewText(); el.className=p.err?'err':'okmsg'; el.textContent=p.err||p.ok; }
function saveForm(){
  const p=previewText(); if (p.err){ ST.adminErr=p.err; render(); return; }
  if (ST.state.admin==='저장 실패'){ ST.adminErr='저장하지 못했어요. 인터넷 연결을 확인하고 다시 저장해 주세요. 입력한 내용은 그대로 있어요.'; render(); return; }
  const F=ST.form, s=STORES.find(x=>x.id===F.store); const num=x=>x===''?null:Number(x);
  s.gray=false; s.checked=F.date; s.memo=F.memo||s.memo||'';
  s.menus.push({name:F.name||F.part, part:F.part, type:F.type, aged:F.aged, origin:F.origin, p100:num(F.p100), w:num(F.price)?num(F.w):null, price:num(F.price)});
  ST.adminMsg='저장했어요. 지도에 바로 반영돼요.'; newForm(); render();
}
function viewAdmin(){
  let h = `<div class="appbar">운영자 입력 <small>운영자 본인만</small></div><div class="section">`;
  if (ST.state.admin==='로그인 전') return h + `<div class="empty">메뉴 입력은 운영자만 할 수 있어요.<div class="btns" style="justify-content:center;margin-top:16px"><button class="btn primary" onclick="setState('입력')">운영자로 로그인</button></div><div class="sub" style="margin-top:10px">(시안: 실제 로그인은 무료 DB 서비스의 로그인 기능으로, D26-4)</div></div></div>`;
  if (!ST.form) newForm(); const F=ST.form;
  const opt=(k,arr)=>arr.map(v=>`<option ${F[k]===v?'selected':''}>${v}</option>`).join('');
  h += `<label class="f">메뉴를 입력할 가게</label><select onchange="fv('store',this.value)">${STORES.map(s=>`<option value="${s.id}" ${F.store===s.id?'selected':''}>${s.name}${s.gray?' (정보 없음)':''}</option>`).join('')}</select>
    <div class="sub" style="margin-top:6px">메뉴판에 적힌 그대로 넣어 주세요. 없는 칸은 비워 두세요.</div>
    <label class="f">메뉴 이름 (메뉴판 그대로)</label><input value="${esc(F.name)}" oninput="fv('name',this.value)" placeholder="예: 생삼겹살">
    <div class="grid2"><div><label class="f">부위</label><select onchange="fv('part',this.value)">${opt('part',['삼겹살','목살','항정살','갈매기살','기타'])}</select></div>
      <div><label class="f">종류</label><select onchange="fv('type',this.value)">${opt('type',['생고기','냉동','대패','기타'])}</select></div></div>
    <div class="grid2"><div><label class="f">원산지</label><select onchange="fv('origin',this.value)">${opt('origin',['국내산','수입'])}</select></div>
      <div><label class="f">숙성</label><label style="display:flex;gap:6px;align-items:center;padding:8px 0"><input type="checkbox" style="width:auto" ${F.aged?'checked':''} onchange="fv('aged',this.checked)"> 숙성 메뉴</label></div></div>
    <label class="f">100g당 가격 (있으면)</label><input inputmode="numeric" value="${F.p100}" oninput="fv('p100',this.value.trim())" placeholder="예: 9000">
    <div class="grid2"><div><label class="f">1인분 중량 g (있으면)</label><input inputmode="numeric" value="${F.w}" oninput="fv('w',this.value.trim())" placeholder="예: 160"></div>
      <div><label class="f">1인분 가격 (있으면)</label><input inputmode="numeric" value="${F.price}" oninput="fv('price',this.value.trim())" placeholder="예: 14000"></div></div>
    <div id="pv"></div>
    <label class="f">메모 (예: 2인분 이상 주문)</label><input value="${esc(F.memo)}" oninput="fv('memo',this.value)">
    <div class="grid2"><div><label class="f">메뉴 확인일</label><input type="date" value="${F.date}" oninput="fv('date',this.value)"></div>
      <div><label class="f">메뉴판 사진 (선택, 운영자만 볼 수 있어요)</label><input type="file" accept="image/*"></div></div>
    <div class="btns"><button class="btn primary" onclick="saveForm()">메뉴 저장</button></div>
    ${ST.adminErr?`<div class="err">${ST.adminErr}</div>`:''}${ST.adminMsg?`<div class="okmsg">${ST.adminMsg}</div>`:''}
    <div class="open-q"><b>[열린 질문 Q9]</b> 저장 시 카카오 장소 ID와 좌표를 함께 저장(D27). 카카오 약관상 좌표 저장이 허용되는지 개발 전 확인 필요.</div>`;
  // 표기 비율 (R14)
  const entered = STORES.filter(s=>!s.gray && s.menus.some(m=>RANKED_PARTS.includes(m.part)));
  const ok = entered.filter(s=>s.menus.some(m=>RANKED_PARTS.includes(m.part)&&unit(m)));
  h += `<div class="groupttl">중량 표기 비율 (Should · R14)</div><div class="card">주안역: 확인한 ${entered.length}곳 중 ${ok.length}곳(${Math.round(ok.length/entered.length*100)}%)이 100g당 가격을 계산할 수 있어요</div></div>`;
  return h;
}

// ===== 렌더 =====
function render(){
  document.getElementById('tabs').innerHTML = '<span class="lbl">화면</span>' + TABS.map(([k,l])=>`<button class="${ST.tab===k?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('');
  const cur = ST.state[ST.tab];
  document.getElementById('states').innerHTML = '<span class="lbl">상태</span>' + STATES[ST.tab].map(s=>`<button class="${cur===s?'on':''}" onclick="setState('${s}')">${s}</button>`).join('');
  document.getElementById('stateinfo').textContent = STATE_NOTE[cur] ? '지금 상태: ' + STATE_NOTE[cur] : '';
  document.getElementById('phone').innerHTML = ({map:viewMap, cmp:viewCmp, detail:viewDetail, admin:viewAdmin})[ST.tab]();
  document.getElementById('reqs').textContent = '이 화면이 다루는 요구사항: ' + REQS[ST.tab];
  renderPreview();
}
render();
</script>
</body>
</html>
